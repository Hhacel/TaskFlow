version: '3.8'

services:
  api-gateway:
    build: ./apps/api-gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    depends_on:
      - scheduler
      - aggregator

  scheduler:
    build: ./apps/scheduler
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - DB_HOST=postgres
    depends_on:
      - postgres
      - nats

  worker:
    build: ./apps/worker
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
    depends_on:
      - nats

  notifier:
    build: ./apps/notifier
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
    depends_on:
      - nats

  aggregator:
    build: ./apps/aggregator
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - DB_HOST=postgres
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=taskflow
      - POSTGRES_USER=taskflow
      - POSTGRES_PASSWORD=taskflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "8222:8222"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data:
