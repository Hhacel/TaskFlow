# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Build API Service
      run: go build -v ./apps/api/cmd/

    - name: Build Scheduler Service
      run: go build -v ./apps/scheduler/cmd/

    - name: Build Worker Service
      run: go build -v ./apps/worker/cmd/

    - name: Build Notifier Service
      run: go build -v ./apps/notifier/cmd/

    - name: Build Shared Packages
      run: go build -v ./pkg/...

    - name: Build Models
      run: go build -v ./models/

    - name: Run Tests
      run: go test -v ./...

    - name: Run Tests with Coverage
      run: go test -v -coverprofile=coverage.out ./...

    - name: Display Coverage
      run: go tool cover -func=coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        args: --timeout=5m

  docker:
    runs-on: ubuntu-latest
    needs: [build, lint]
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker Images
      run: docker compose build

    - name: Verify Docker Compose
      run: docker compose config
