# Scheduler Configuration
# This file can be overridden by environment variables

server:
  port: "8081"

database:
  host: "postgres"
  port: "5432"
  user: "taskflow"
  password: "taskflow"
  database: "taskflow"
  ssl_mode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime_minutes: 5

nats:
  url: "nats://nats:4222"
  task_schedule_subject: "tasks.schedule"
  task_result_subject: "tasks.results"
  reconnect_wait_seconds: 2
  max_reconnects: 60

logging:
  level: "info"  # debug, info, warn, error
  format: "json" # json or text
