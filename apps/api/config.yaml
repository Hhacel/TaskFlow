# Scheduler Configuration
# This file can be overridden by environment variables

server:
  port: "8081"

database:
  host: "postgres"
  port: "5432"
  user: "taskflow"
  password: "taskflow"
  database: "taskflow"
  ssl_mode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime_minutes: 60

logging:
  level: "info"  # debug, info, warn, error
  format: "json" # json or text
