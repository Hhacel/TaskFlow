global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'taskflow-services'
    static_configs:
      - targets: 
        - 'api-gateway:8080'
        - 'scheduler:8081'
        - 'worker:8082'
        - 'notifier:8083'
        - 'aggregator:8084'
    metrics_path: '/metrics'
    scrape_interval: 10s
